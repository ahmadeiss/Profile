<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Me</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #333);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 40px;
      font-size: 2.5rem;
      letter-spacing: 1px;
      animation: fadeInDown 1s ease forwards;
    }

    /* Doors container */
    .doors-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 60px 0;
    }

    /* Door styling */
    .door {
      width: 200px;
      height: 350px;
      background: linear-gradient(145deg, #5a3e2b, #3e2a1f);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,0,0,0.4);
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.5s ease;
      overflow: hidden;
    }
    .door:hover {
      transform: scale(1.05);
    }
    .door-panel {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #8B4513, #A0522D);
      border-radius: 10px;
      transform-origin: left;
      transition: transform 0.7s ease;
      z-index: 2;
    }
    .door.open .door-panel {
      transform: rotateY(-100deg);
    }

    /* Door label */
    .door-number {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      padding: 15px;
      z-index: 3;
    }

    /* Modal background */
    #modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.6);
      z-index: 10;
      animation: fadeIn 0.3s ease forwards;
    }

    /* Modal content */
    #info {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background-color: #222;
      color: #fff;
      padding: 30px;
      border-radius: 15px;
      max-width: 600px;
      width: 80%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      z-index: 20;
      animation: popUp 0.4s ease forwards;
    }
    #info h2 {
      margin-bottom: 15px;
      font-size: 1.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
    }
    #info p, #info ul {
      font-size: 1rem;
      line-height: 1.5;
    }
    #close-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    #close-btn:hover {
      background: #e64a19;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popUp {
      from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .door {
        width: 150px;
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <h1>Welcome to My Portfolio</h1>

  <div class="doors-container">
    <div class="door" onclick="openDoor(this, 'certificates')">
      <div class="door-panel"></div>
      <div class="door-number">Certificates</div>
    </div>
    <div class="door" onclick="openDoor(this, 'age')">
      <div class="door-panel"></div>
      <div class="door-number">Personal Information</div>
    </div>
    <div class="door" onclick="openDoor(this, 'name')">
      <div class="door-panel"></div>
      <div class="door-number">Expertise</div>
    </div>
    <div class="door" onclick="openDoor(this, 'edu')">
      <div class="door-panel"></div>
      <div class="door-number">Education</div>
    </div>
  </div>

  <div id="modal-bg" onclick="closeInfo()"></div>

  <div id="info">
    <h2 id="info-title"></h2>
    <div id="info-content"></div>
    <button id="close-btn" onclick="closeInfo()">Close</button>
  </div>

  <script>
    function openDoor(element, section) {
      element.classList.add('open');

      setTimeout(() => {
        var infoTitle = document.getElementById('info-title');
        var infoContent = document.getElementById('info-content');
        var info = document.getElementById('info');
        var modalBg = document.getElementById('modal-bg');

        if (section === 'certificates') {
          infoTitle.textContent = 'My Certificates';
          infoContent.innerHTML = `
            <ul>
              <li>Certificate 1: Training for employee</li>
              <li>Certificate 2: Coming Soon</li>
              <li>Certificate 3: Coming Soon</li>
            </ul>
          `;
        } else if (section === 'age') {
          infoTitle.textContent = 'Personal Information';
          infoContent.textContent = 'I am 22 years old.';
        } else if (section === 'name') {
          infoTitle.textContent = 'My Expertise';
          infoContent.textContent = 'Expert in software development and networking.';
        } else if (section === 'edu') {
          infoTitle.textContent = 'My Education';
          infoContent.innerHTML = `
            <ul>
              <li>Secondary School: Deir Debwan</li>
              <li>Bachelor: Computer Engineering - Birzeit University</li>
              <li>Other: Coming Soon</li>
            </ul>
          `;
        }

        modalBg.style.display = 'block';
        info.style.display = 'block';
      }, 700);
    }

    function closeInfo() {
      document.querySelectorAll('.door').forEach(d => d.classList.remove('open'));
      document.getElementById('modal-bg').style.display = 'none';
      document.getElementById('info').style.display = 'none';
    }
  </script>

</body>
</html>
